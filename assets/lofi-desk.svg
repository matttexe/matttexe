<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Animated lo-fi scene: a desk with a laptop and coffee by a rainy night window">
  <style>
    .rain line { stroke: #9fb4ff; stroke-width: 1.2; stroke-linecap: round; opacity: .55; animation: fall 1.1s linear infinite; }
    .rain line:nth-child(2n) { animation-duration: .9s; animation-delay: -.3s; }
    .rain line:nth-child(3n) { animation-duration: 1.3s; animation-delay: -.6s; }
    .rain line:nth-child(5n) { animation-delay: -.8s; }
    @keyframes fall { from { transform: translate(0,-40px); } to { transform: translate(-12px,170px); } }

    .win { animation: flicker 4s steps(1) infinite; }
    .win.b { animation-delay: -1.5s; animation-duration: 5s; }
    .win.c { animation-delay: -2.7s; animation-duration: 6s; }
    @keyframes flicker { 0%,100% { opacity: .9; } 40% { opacity: .25; } 70% { opacity: .9; } }

    .steam path { fill: none; stroke: #e8e2ff; stroke-width: 2; stroke-linecap: round; opacity: 0; animation: steam 3s ease-in-out infinite; }
    .steam path:nth-child(2) { animation-delay: 1s; }
    .steam path:nth-child(3) { animation-delay: 2s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .6; } 100% { opacity: 0; transform: translateY(-16px); } }

    .code rect { animation: type 6s steps(1) infinite; }
    .code rect:nth-child(1) { animation-delay: 0s; }
    .code rect:nth-child(2) { animation-delay: .5s; }
    .code rect:nth-child(3) { animation-delay: 1s; }
    .code rect:nth-child(4) { animation-delay: 1.5s; }
    .code rect:nth-child(5) { animation-delay: 2s; }
    .code rect:nth-child(6) { animation-delay: 2.5s; }
    @keyframes type { 0% { opacity: 0; } 8%, 85% { opacity: 1; } 100% { opacity: 0; } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .55; } }

    .note { opacity: 0; animation: note 5s ease-out infinite; }
    .note.n2 { animation-delay: 1.7s; }
    .note.n3 { animation-delay: 3.4s; }
    @keyframes note { 0% { opacity: 0; transform: translate(0,0); } 20% { opacity: .9; } 100% { opacity: 0; transform: translate(-22px,-60px); } }

    .leaf { transform-origin: 340px 214px; animation: sway 5s ease-in-out infinite; }
    @keyframes sway { 50% { transform: rotate(3deg); } }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#4a2c6b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231c3d"/>
      <stop offset="1" stop-color="#17122b"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f7bff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="windowClip"><rect x="40" y="30" width="200" height="140" rx="4"/></clipPath>
  </defs>

  <!-- room -->
  <rect width="400" height="250" rx="14" fill="url(#wall)"/>

  <!-- window -->
  <g clip-path="url(#windowClip)">
    <rect x="40" y="30" width="200" height="140" fill="url(#sky)"/>
    <circle cx="200" cy="62" r="14" fill="#f4e9c8" opacity=".9"/>
    <circle cx="206" cy="58" r="12" fill="#2a2150" opacity=".9"/>
    <!-- skyline -->
    <path d="M40 170 V128 h18 v-14 h16 v22 h12 v-34 h22 v46 h10 v-26 h20 v-12 h16 v38 h14 v-30 h24 v18 h14 v-8 h24 V170 Z" fill="#120e26"/>
    <g fill="#ffd27a">
      <rect class="win" x="92" y="108" width="4" height="5"/>
      <rect class="win b" x="100" y="120" width="4" height="5"/>
      <rect class="win c" x="138" y="124" width="4" height="5"/>
      <rect class="win" x="148" y="134" width="4" height="5"/>
      <rect class="win b" x="182" y="136" width="4" height="5"/>
      <rect class="win c" x="206" y="148" width="4" height="5"/>
      <rect class="win" x="64" y="120" width="4" height="5"/>
    </g>
    <g class="rain">
      <line x1="52" y1="30" x2="49" y2="42"/>
      <line x1="70" y1="50" x2="67" y2="62"/>
      <line x1="88" y1="20" x2="85" y2="32"/>
      <line x1="104" y1="64" x2="101" y2="76"/>
      <line x1="122" y1="34" x2="119" y2="46"/>
      <line x1="140" y1="10" x2="137" y2="22"/>
      <line x1="156" y1="54" x2="153" y2="66"/>
      <line x1="172" y1="26" x2="169" y2="38"/>
      <line x1="190" y1="70" x2="187" y2="82"/>
      <line x1="208" y1="18" x2="205" y2="30"/>
      <line x1="224" y1="46" x2="221" y2="58"/>
      <line x1="240" y1="30" x2="237" y2="42"/>
      <line x1="62" y1="90" x2="59" y2="102"/>
      <line x1="132" y1="88" x2="129" y2="100"/>
      <line x1="198" y1="96" x2="195" y2="108"/>
    </g>
  </g>
  <!-- window frame -->
  <rect x="40" y="30" width="200" height="140" rx="4" fill="none" stroke="#3b2f60" stroke-width="6"/>
  <line x1="140" y1="30" x2="140" y2="170" stroke="#3b2f60" stroke-width="4"/>
  <line x1="40" y1="100" x2="240" y2="100" stroke="#3b2f60" stroke-width="4"/>
  <rect x="32" y="168" width="216" height="8" rx="2" fill="#3b2f60"/>

  <!-- lamp -->
  <circle cx="320" cy="150" r="70" fill="url(#lampGlow)" class="glow"/>
  <path d="M300 100 h40 l-10 -26 h-20 Z" fill="#e9a65c"/>
  <rect x="318" y="100" width="4" height="114" fill="#5a4a7a"/>
  <rect x="306" y="212" width="28" height="6" rx="2" fill="#5a4a7a"/>

  <!-- desk -->
  <rect x="0" y="218" width="400" height="14" fill="#5b3e5e"/>
  <path d="M0 232 h400 v4 a14 14 0 0 1 -14 14 h-372 a14 14 0 0 1 -14 -14 Z" fill="#3a2742"/>

  <!-- laptop -->
  <ellipse cx="170" cy="185" rx="90" ry="50" fill="url(#screenGlow)" class="glow"/>
  <path d="M112 148 h116 a6 6 0 0 1 6 6 v58 h-128 v-58 a6 6 0 0 1 6 -6 Z" fill="#2c2448"/>
  <rect x="114" y="154" width="112" height="54" rx="2" fill="#120f24"/>
  <g class="code">
    <rect x="120" y="160" width="40" height="4" rx="2" fill="#c792ea"/>
    <rect x="128" y="168" width="64" height="4" rx="2" fill="#82aaff"/>
    <rect x="128" y="176" width="48" height="4" rx="2" fill="#c3e88d"/>
    <rect x="136" y="184" width="70" height="4" rx="2" fill="#ffcb6b"/>
    <rect x="128" y="192" width="36" height="4" rx="2" fill="#82aaff"/>
    <rect x="120" y="200" width="20" height="4" rx="2" fill="#c792ea"/>
  </g>
  <rect class="cursor" x="144" y="199" width="3" height="6" fill="#e8e2ff"/>
  <path d="M96 212 h148 l8 8 h-164 Z" fill="#4a3d70"/>

  <!-- mug + steam -->
  <g class="steam">
    <path d="M272 188 q-5 -8 0 -16 q5 -8 0 -16"/>
    <path d="M281 188 q-5 -8 0 -16 q5 -8 0 -16"/>
    <path d="M290 188 q-5 -8 0 -16 q5 -8 0 -16"/>
  </g>
  <rect x="266" y="192" width="30" height="26" rx="4" fill="#e07a8f"/>
  <path d="M296 198 q10 0 10 8 q0 8 -10 8" fill="none" stroke="#e07a8f" stroke-width="4"/>

  <!-- plant -->
  <g class="leaf">
    <path d="M340 214 q-16 -18 -6 -38 q8 16 6 38 Z" fill="#6fcf97"/>
    <path d="M340 214 q14 -22 30 -24 q-8 18 -30 24 Z" fill="#4fae7c"/>
    <path d="M340 214 q-22 -6 -30 -20 q18 0 30 20 Z" fill="#4fae7c"/>
  </g>
  <path d="M328 212 h24 l-4 16 h-16 Z" fill="#c98a5c" transform="translate(0,-10)"/>

  <!-- headphones on desk -->
  <path d="M42 218 q0 -26 26 -26 q26 0 26 26" fill="none" stroke="#8f7bff" stroke-width="5" stroke-linecap="round"/>
  <rect x="36" y="206" width="12" height="14" rx="4" fill="#6b5bd6"/>
  <rect x="88" y="206" width="12" height="14" rx="4" fill="#6b5bd6"/>

  <!-- music notes -->
  <g fill="#d6ccff">
    <g class="note"><circle cx="72" cy="186" r="3.5"/><rect x="74.5" y="172" width="1.6" height="14"/></g>
    <g class="note n2"><circle cx="64" cy="190" r="3.5"/><rect x="66.5" y="176" width="1.6" height="14"/><rect x="66.5" y="176" width="8" height="1.6"/></g>
    <g class="note n3"><circle cx="78" cy="192" r="3.5"/><rect x="80.5" y="178" width="1.6" height="14"/></g>
  </g>
</svg>
